//////////////////
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>یه چیزی می‌خوام بهت بگم ❤️</title>

    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================================
           BODY
        ====================================================== */

        body {
            min-height: 100vh;
            min-height: 100dvh;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Tahoma, Arial, sans-serif;

            color: #fff;

            position: relative;

            /*
                ==============================================
                عکس پس‌زمینه
                ==============================================

                فقط اسم فایل را اینجا تغییر بده.

                مثال:
                background.jpg
                photo.png
                hajigrinof.jpg
            */

            background-image: url("./background.png");

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;

            background-attachment: fixed;
        }


        /* =====================================================
           DARK OVERLAY
           
           این لایه باعث می‌شود عکس پس‌زمینه
           کمی تاریک و مخفی باشد تا متن خوانا بماند.
        ====================================================== */

        body::before {
            content: "";

            position: fixed;

            inset: 0;

            background:
                linear-gradient(
                    rgba(5, 3, 8, 0.64),
                    rgba(5, 3, 8, 0.74)
                );

            z-index: 0;

            pointer-events: none;
        }


        /* =====================================================
           MOVING LIGHT EFFECT
        ====================================================== */

        body::after {
            content: "";

            position: fixed;

            inset: -30%;

            background:
                conic-gradient(
                    from 0deg,
                    transparent,
                    #ff3d76,
                    transparent,
                    #9c3cff,
                    transparent
                );

            filter: blur(80px);

            opacity: 0.12;

            animation:
                spin 14s linear infinite;

            z-index: 1;

            pointer-events: none;
        }


        /* =====================================================
           FLOATING HEARTS
        ====================================================== */

        .heart {
            position: fixed;

            bottom: -60px;

            font-size: 20px;

            opacity: 0;

            pointer-events: none;

            z-index: 3;

            animation:
                float 7s linear infinite;
        }


        .h1 {
            left: 8%;
        }


        .h2 {
            left: 25%;

            animation-delay: 2s;
        }


        .h3 {
            right: 18%;

            animation-delay: 4s;
        }


        .h4 {
            right: 7%;

            animation-delay: 1s;
        }


        /* =====================================================
           MAIN CARD
        ====================================================== */

        .card {
            position: relative;

            z-index: 10;

            width: min(92vw, 470px);

            padding: 42px 28px 34px;

            text-align: center;

            border-radius: 30px;

            border:
                1px solid rgba(255, 255, 255, 0.15);

            /*
                کارت نیمه شفاف است تا عکس پشت آن
                کمی دیده شود.
            */

            background:
                rgba(15, 7, 14, 0.62);

            backdrop-filter:
                blur(22px);

            -webkit-backdrop-filter:
                blur(22px);

            box-shadow:
                0 25px 90px rgba(255, 30, 100, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.10);

            animation:
                appear 0.8s ease;
        }


        /* =====================================================
           CARD RING
        ====================================================== */

        .ring {
            position: absolute;

            inset: -12px;

            border-radius: 42px;

            border:
                1px solid rgba(255, 91, 135, 0.20);

            animation:
                pulse 2.8s ease-in-out infinite;

            pointer-events: none;
        }


        /* =====================================================
           BADGE
        ====================================================== */

        .badge {
            display: inline-block;

            padding: 8px 15px;

            margin-bottom: 20px;

            border-radius: 999px;

            background:
                rgba(255, 72, 119, 0.10);

            border:
                1px solid rgba(255, 112, 151, 0.28);

            color: #ffabc3;

            font-size: 12px;

            letter-spacing: 3px;

            position: relative;

            z-index: 2;
        }


        /* =====================================================
           MESSAGE
        ====================================================== */

        #msg {
            min-height: 125px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            position: relative;

            z-index: 2;

            transition:
                opacity 0.25s ease;
        }


        h1 {
            margin-bottom: 14px;

            font-size: 30px;

            line-height: 1.6;

            text-shadow:
                0 0 28px rgba(255, 67, 120, 0.40);
        }


        p {
            margin-bottom: 30px;

            color: #ead7df;

            font-size: 15px;

            line-height: 2;
        }


        /* =====================================================
           BUTTON AREA
        ====================================================== */

        .buttons {
            display: flex;

            flex-direction: row-reverse;

            justify-content: center;

            align-items: center;

            gap: 14px;

            position: relative;

            z-index: 2;
        }


        /* =====================================================
           BUTTON
        ====================================================== */

        .btn {
            min-width: 125px;

            padding: 15px 31px;

            border: 0;

            border-radius: 16px;

            font-family: inherit;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        .btn:hover {
            transform:
                translateY(-3px)
                scale(1.03);
        }


        .btn:active {
            transform:
                scale(0.95);
        }


        /* =====================================================
           YES BUTTON
        ====================================================== */

        .yes {
            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #ff3f78,
                    #b91d55
                );

            box-shadow:
                0 12px 30px
                rgba(255, 47, 109, 0.32);
        }


        .yes:hover {
            box-shadow:
                0 15px 40px
                rgba(255, 47, 109, 0.55);
        }


        /* =====================================================
           NO BUTTON
        ====================================================== */

        .no {
            color: #f7dce5;

            background:
                rgba(255, 255, 255, 0.07);

            border:
                1px solid rgba(255, 255, 255, 0.14);
        }


        .no:hover {
            background:
                rgba(255, 255, 255, 0.13);
        }


        /* =====================================================
           FINAL STATE
        ====================================================== */

        .final h1 {
            font-size: 32px;
        }


        .final p {
            color: #ffd7e2;
        }


        /* =====================================================
           SPARKS
        ====================================================== */

        .spark {
            position: fixed;

            pointer-events: none;

            font-size: 22px;

            z-index: 100;

            animation:
                burst 1s ease forwards;
        }


        /* =====================================================
           ANIMATIONS
        ====================================================== */

        @keyframes appear {

            from {
                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.96);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);

                opacity: 0.30;
            }

            50% {
                transform: scale(1.02);

                opacity: 0.65;
            }
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        @keyframes float {

            0% {
                transform:
                    translateY(0)
                    scale(0.7)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: 0.55;
            }

            85% {
                opacity: 0.25;
            }

            100% {
                transform:
                    translateY(-110vh)
                    scale(1.25)
                    rotate(25deg);

                opacity: 0;
            }
        }


        @keyframes burst {

            0% {
                transform:
                    translate(0, 0)
                    scale(0.5);

                opacity: 1;
            }

            100% {
                transform:
                    translate(var(--x), var(--y))
                    scale(1.4);

                opacity: 0;
            }
        }


        /* =====================================================
           TABLET / MOBILE
        ====================================================== */

        @media (max-width: 520px) {

            body {
                background-position:
                    center center;

                /*
                    fixed در بعضی موبایل‌ها
                    رفتار متفاوتی دارد؛ بنابراین
                    روی موبایل حذف می‌شود.
                */

                background-attachment:
                    scroll;
            }


            .card {
                width: 90vw;

                padding:
                    34px
                    20px
                    28px;

                border-radius: 25px;
            }


            .ring {
                inset: -8px;

                border-radius: 34px;
            }


            h1 {
                font-size: 25px;
            }


            .final h1 {
                font-size: 27px;
            }


            p {
                font-size: 14px;
            }


            .buttons {
                gap: 10px;
            }


            .btn {
                min-width: 110px;

                padding:
                    13px
                    20px;

                font-size: 14px;
            }


            body::after {
                opacity: 0.08;

                filter:
                    blur(65px);
            }
        }


        /* =====================================================
           VERY SMALL PHONES
        ====================================================== */

        @media (max-width: 360px) {

            .card {
                width: 92vw;

                padding:
                    30px
                    15px
                    24px;
            }


            h1 {
                font-size: 22px;
            }


            .buttons {
                flex-direction: column;
            }


            .btn {
                width: 100%;
            }


            .badge {
                font-size: 10px;

                letter-spacing: 2px;
            }
        }


        /* =====================================================
           LANDSCAPE PHONES
        ====================================================== */

        @media
        (max-height: 500px)
        and (orientation: landscape) {

            .card {
                padding:
                    22px
                    25px;
            }


            #msg {
                min-height: 90px;
            }


            h1 {
                font-size: 23px;
            }


            p {
                margin-bottom: 15px;
            }


            .badge {
                margin-bottom: 10px;
            }
        }


        /* =====================================================
           REDUCE MOTION
        ====================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                scroll-behavior: auto !important;
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         FLOATING HEARTS
    ====================================================== -->

    <div class="heart h1">♥</div>

    <div class="heart h2">♡</div>

    <div class="heart h3">♥</div>

    <div class="heart h4">♡</div>


    <!-- =====================================================
         MAIN CARD
    ====================================================== -->

    <main
        class="card"
        id="card">

        <div class="ring"></div>


        <div class="badge">
            FOR YOU ♥
        </div>


        <!-- =================================================
             MESSAGE
        ================================================== -->

        <section id="msg">

            <h1>
                می‌خوام بهت چیزی بگم...
            </h1>

            <p>
                یه چیز کوچیکه، ولی شاید قشنگ باشه 👀
            </p>

        </section>


        <!-- =================================================
             BUTTONS
        ================================================== -->

        <div
            class="buttons"
            id="buttons">

            <button
                class="btn yes"
                id="yesBtn"
                type="button">

                باشه 💗

            </button>


            <button
                class="btn no"
                id="noBtn"
                type="button">

                نگو 🙈

            </button>

        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =================================================
           ELEMENTS
        ================================================== */

        const card =
            document.getElementById("card");

        const message =
            document.getElementById("msg");

        const buttons =
            document.getElementById("buttons");

        const yesBtn =
            document.getElementById("yesBtn");

        const noBtn =
            document.getElementById("noBtn");


        /* =================================================
           NO BUTTON MESSAGES
        ================================================== */

        const noTexts = [

            "نگو؟ 🥺 باشه... ولی هنوز دلم می‌خواد بگمش ♥",

            "یعنی واقعاً نمی‌خوای بشنوی؟ 👀💗",

            "باشه، نمی‌گم... ولی یه لبخند بزن اول 😌",

            "این «نگو» خیلی بی‌رحمانه بود 🥹♥",

            "باشه... پس یه بار دیگه می‌پرسم؛ بگم؟ 🌙"

        ];


        let noIndex = 0;


        /* =================================================
           NO BUTTON
        ================================================== */

        function sayNo() {

            message.style.opacity = "0";


            setTimeout(() => {

                message.innerHTML = `

                    <h1>
                        ${noTexts[
                            noIndex %
                            noTexts.length
                        ]}
                    </h1>

                    <p>
                        باشه... ولی هنوز یه حرف قشنگ برات دارم ❤️
                    </p>

                `;


                message.style.opacity = "1";


                noIndex++;


                createSparkBurst(7);

            }, 180);
        }


        /* =================================================
           YES BUTTON
        ================================================== */

        function sayYes() {

            message.style.opacity = "0";


            setTimeout(() => {

                message.innerHTML = `

                    <h1>
                        حالا بیا بازی کنیم 🎮❤️
                    </h1>

                    <p>
                        منتظرت بودم... آماده‌ای؟ ✨
                    </p>

                `;


                buttons.innerHTML = `

                    <button
                        class="btn yes"
                        id="startBtn"
                        type="button">

                        بزن بریم 💞

                    </button>

                `;


                card.classList.add("final");


                message.style.opacity = "1";


                const startBtn =
                    document.getElementById(
                        "startBtn"
                    );


                startBtn.addEventListener(
                    "click",
                    startGame
                );


                createSparkBurst(18);

            }, 180);
        }


        /* =================================================
           START GAME
        ================================================== */

        function startGame() {

            message.style.opacity = "0";


            setTimeout(() => {

                message.innerHTML = `

                    <h1>
                        شروع شد! 🎮💕
                    </h1>

                    <p>
                        این دفعه فرار ممنوعه 😏
                    </p>

                `;


                message.style.opacity = "1";


                createSparkBurst(25);

            }, 180);
        }


        /* =================================================
           SPARK / HEART BURST
        ================================================== */

        function createSparkBurst(
            amount = 6
        ) {

            const symbols = [
                "♥",
                "♡",
                "✦",
                "✨"
            ];


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                const spark =
                    document.createElement(
                        "span"
                    );


                spark.className =
                    "spark";


                spark.textContent =
                    symbols[
                        Math.floor(
                            Math.random() *
                            symbols.length
                        )
                    ];


                /*
                    شروع افکت
                */

                spark.style.left =
                    "50%";

                spark.style.top =
                    "48%";


                /*
                    مسیر تصادفی
                */

                const x =
                    Math.random() * 300 - 150;

                const y =
                    Math.random() * 220 - 110;


                spark.style.setProperty(
                    "--x",
                    `${x}px`
                );


                spark.style.setProperty(
                    "--y",
                    `${y}px`
                );


                document.body.appendChild(
                    spark
                );


                /*
                    حذف بعد از انیمیشن
                */

                setTimeout(() => {

                    spark.remove();

                }, 1000);
            }
        }


        /* =================================================
           EVENTS
        ================================================== */

        yesBtn.addEventListener(
            "click",
            sayYes
        );


        noBtn.addEventListener(
            "click",
            sayNo
        );


    </script>

</body>

</html>
